<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pátio Escolar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: painel lateral fixo + área de trabalho; no celular vira barra inferior com 4 abas */
:root{
  --bg:#eef2f5; --surface:#ffffff; --sunk:#f5f7f9; --ink:#14212b; --muted:#5a6a76; --line:#d9e0e6;
  --accent:#1d5c86; --accent-soft:#e2edf5; --accent-ink:#ffffff;
  --pencil:#e3a01b; --pencil-soft:#fbf0d6;
  --good:#1d8456; --good-soft:#e1f2e9; --warn:#a96d10; --warn-soft:#fbefd9; --bad:#bd3a2c; --bad-soft:#f9e3e0;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 8px 24px rgba(20,33,43,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#16212a; --sunk:#111a21; --ink:#e4ecf1; --muted:#93a4b0; --line:#253441;
  --accent:#6eb2df; --accent-soft:#1a3244; --accent-ink:#0b1720;
  --pencil:#f0b84a; --pencil-soft:#3a2e14;
  --good:#4fc48c; --good-soft:#163428; --warn:#e5aa4b; --warn-soft:#3a2c12; --bad:#ef7062; --bad-soft:#3d1c18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#16212a; --sunk:#111a21; --ink:#e4ecf1; --muted:#93a4b0; --line:#253441;
  --accent:#6eb2df; --accent-soft:#1a3244; --accent-ink:#0b1720;
  --pencil:#f0b84a; --pencil-soft:#3a2e14;
  --good:#4fc48c; --good-soft:#163428; --warn:#e5aa4b; --warn-soft:#3a2c12; --bad:#ef7062; --bad-soft:#3d1c18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600;font-family:var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto}
.side{position:sticky;top:20px;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 12px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--pencil);display:grid;place-items:center;color:#1b1406;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.brand b{font-family:var(--f-display);font-size:1.25rem}
.brand small{display:block;font-size:.72rem;color:var(--muted);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);padding:1px 7px;border-radius:99px;color:var(--muted)}
.nav-g{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 10px 4px}
.nav-g:first-child{padding-top:0}
.nav .soon{opacity:.55;cursor:default}
.nav .soon:hover{background:none;color:var(--muted)}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);padding:0 8px;border-top:1px solid var(--line);padding-top:14px}
.tag-ex{display:inline-block;font-size:.7rem;font-weight:600;background:var(--pencil-soft);color:var(--warn);padding:2px 8px;border-radius:99px;letter-spacing:.02em}

.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.95rem;color:var(--muted);font-weight:500}
.kpi .d{font-size:.82rem;color:var(--muted)}
.kpi.hl{border-color:var(--pencil);box-shadow:inset 0 0 0 1px var(--pencil)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-soft);color:var(--good)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--accent-soft);color:var(--accent)}
.p-mute{background:var(--sunk);color:var(--muted)}

.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#fff;flex:none;font-family:var(--f-body)}
.av.lg{width:84px;height:84px;font-size:1.6rem;border-radius:22px}

/* feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:52px 36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.feed .t{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.feed .who{min-width:0}
.feed .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .who span{font-size:.8rem;color:var(--muted)}
.feed li.new{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--pencil-soft)}to{background:transparent}}

.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:.86rem}
.bar{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.full{background:var(--warn)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;background:var(--sunk);border-radius:10px;font-size:.9rem}
.todo b{font-family:var(--f-mono);font-size:.95rem}

/* alunos */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.input,.select,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;min-width:0}
.input:focus,.select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.84rem;cursor:pointer;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row-h,.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1.6fr) 120px 110px;gap:14px;align-items:center;padding:10px 12px}
.row-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--sunk)}
.row .name{display:flex;align-items:center;gap:12px;min-width:0}
.row .name div{min-width:0}
.row .name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .name span{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.cell-trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px;
  display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--line);box-shadow:var(--shadow)}
.drawer .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.iconbtn{border:0;background:var(--sunk);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:.9rem;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.sect{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:16px;z-index:51;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal-scrim{z-index:50}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio-list label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.radio-list label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* portaria */
.porta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px}
.last{display:flex;gap:18px;align-items:center}
.last .info{min-width:0}
.last .dir{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.1}
.last.bloq .dir{color:var(--bad)}
.last.ok .dir{color:var(--good)}
.clock{font-family:var(--f-mono);font-size:2.4rem;font-weight:500;letter-spacing:-.02em;line-height:1}
.ctrl{display:flex;flex-direction:column;gap:12px}
.ctrl label{font-size:.84rem;color:var(--muted);font-weight:600}
.switch{display:flex;align-items:center;gap:10px;font-size:.9rem;cursor:pointer}
.switch input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{left:19px}
.inside{display:flex;align-items:baseline;gap:8px}
.inside .num{font-size:2rem;font-family:var(--f-display);font-weight:700}

/* matrícula */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.col{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:.86rem;display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card b{font-weight:600}
.card .meta{font-size:.8rem;color:var(--muted)}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;counter-reset:s;flex-wrap:wrap}
.steps li{flex:1 1 110px;font-size:.8rem;color:var(--muted);border-top:3px solid var(--line);padding-top:8px;counter-increment:s}
.steps li::before{content:counter(s) ". ";font-family:var(--f-mono)}
.steps li.done{border-color:var(--accent);color:var(--ink)}
.steps li.cur{border-color:var(--pencil);color:var(--ink);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.84rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--muted)}
.field .err{font-size:.78rem;color:var(--bad)}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.check:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.summary{background:var(--sunk);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.summary .line{display:flex;justify-content:space-between;gap:10px}
.summary .total{font-weight:700;font-size:1.05rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.callout{padding:10px 12px;border-radius:10px;font-size:.88rem}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.turmas-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.turmas-pick label{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.turmas-pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.turmas-pick input{position:absolute;opacity:0}
.turmas-pick label.full{opacity:.5;cursor:not-allowed}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.tabbar{display:none}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){.grid2,.porta{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  body{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px))}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  h1{font-size:1.5rem}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;padding:6px 0;color:var(--muted);cursor:pointer;border-radius:8px}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
  .tabbar svg{width:20px;height:20px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .row-h{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .row .c-turma,.row .c-resp{display:none}
  .row .c-pres{grid-column:2;grid-row:1}
  .row .c-status{grid-column:1;padding-left:48px}
  .form{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:minmax(0,1fr)}
  .dl{grid-template-columns:110px minmax(0,1fr)}
  .bar-row{grid-template-columns:92px minmax(0,1fr) 54px}
}
/* pedagógico */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.9rem}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,43,.12)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .n,.tbl th.n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;border-bottom:0}
.gin{width:66px;text-align:right;font-family:var(--f-mono);padding:6px 8px}
.gin.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.low{color:var(--bad);font-weight:600}
.slots{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.slot{flex:0 0 auto;min-width:150px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.slot .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.slot .ok{font-size:.74rem;color:var(--good);font-weight:600}
.att{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.att .who b{display:block;font-weight:600}
.att .who span{font-size:.8rem;color:var(--muted)}
.att-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pf{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pf button{border:0;background:var(--surface);padding:6px 13px;font-weight:600;cursor:pointer;color:var(--muted);font-family:var(--f-mono)}
.pf button.p[aria-pressed="true"]{background:var(--good);color:#fff}
.pf button.f[aria-pressed="true"]{background:var(--bad);color:#fff}
.hor{min-width:700px}
.hor td{padding:6px;min-width:120px}
.hor select{width:100%;padding:6px 8px;font-size:.85rem}
.hor .tp{font-size:.74rem;color:var(--muted);display:block;margin-top:3px;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hor td.conf{background:var(--bad-soft)}

function registrar(s,opts={}){
  const t=state.clock;
  if(s.status!=='ativo'){state.log.push({t,sid:s.id,tipo:'bloqueio',tag:'',nota:'Matrícula inativa'});return {ok:false,msg:'Acesso bloqueado: matrícula inativa'}}
  if(!s.dentro){
    const atraso=t>7*60+15;
    s.dentro=true;state.log.push({t,sid:s.id,tipo:'entrada',tag:atraso?'atraso':(opts.manual?'manual':''),nota:opts.manual?('Liberação manual: '+opts.motivo):'Cartão'});
    return {ok:true,msg:`Entrada registrada${atraso?' com atraso':''}. Aviso enviado a ${s.resp} no app.`};
  }
  if(precisaResp(s)&&!s.saidaApp&&!opts.com){return {ok:false,precisa:true}}
  s.dentro=false;state.log.push({t,sid:s.id,tipo:'saida',tag:t<11*60+50?'antecipada':(opts.manual?'manual':''),nota:opts.com?('Retirado por '+opts.com):(s.saidaApp?'Autorização no app':(opts.manual?'Liberação manual: '+opts.motivo:'Cartão'))});
  return {ok:true,msg:`Saída registrada. Aviso enviado a ${s.resp} no app.`};
}

function evLabel(e){
  if(e.tipo==='bloqueio')return '<span class="pill p-bad">Bloqueado</span>';
  if(e.tipo==='saida')return e.tag==='antecipada'?'<span class="pill p-warn">Saída antecipada</span>':'<span class="pill p-info">Saída</span>';
  if(e.tag==='atraso')return '<span class="pill p-warn">Entrada · atraso</span>';
  if(e.tag==='manual')return '<span class="pill p-info">Entrada manual</span>';
  return '<span class="pill p-good">Entrada</span>';
}
function feedItems(list,newest){
  return list.map((e,i)=>{const s=S(e.sid);return `<li class="${i===0&&newest?'new':''}"><span class="t">${hhmm(e.t)}</span>${av(s.nome)}<span class="who"><b>${esc(s.nome)}</b><span>${esc(T(s.turma).nome)} · ${esc(e.nota)}</span></span>${evLabel(e)}</li>`}).join('');
}

function lastCard(){
  const e=state.log[state.log.length-1];if(!e)return '<p class="muted">Nenhuma passagem ainda.</p>';
  const s=S(e.sid),bloq=e.tipo==='bloqueio';

function logPanel(){
  const f=state.logFilter;

   <div class="chips" role="group" aria-label="Filtrar registro" style="margin-bottom:10px">${[['todos','Tudo'],['entradas','Entradas'],['saidas','Saídas'],['ocorr','Ocorrências']].map(([k,l])=>`<button type="button" class="chip" data-lf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>

function calc(){const d=state.wizard.d;const anual=PRECO[T(d.turma).nivel]*12;const pct=(d.desc.irmao?10:0)+(d.desc.pont?5:0)+(d.desc.conv?10:0);const total=anual*(1-pct/100);return {anual,pct,parcela:total/(+d.parc)}}
function validar(){
  const w=state.wizard,d=w.d,e={};
  if(w.step===0){if(d.nome.trim().split(/\s+/).length<2)e.nome='Informe nome e sobrenome.';if(!d.nasc)e.nasc='Informe a data de nascimento.';if(!d.turma)e.turma='Escolha a série.'}
  if(w.step===1){if(d.resp.trim().split(/\s+/).length<2)e.resp='Informe nome e sobrenome.';if(d.cpf.replace(/\D/g,'').length!==11)e.cpf='O CPF tem 11 dígitos.';if(d.tel.replace(/\D/g,'').length<10)e.tel='Informe o celular com DDD.';if(d.email&&!/^\S+@\S+\.\S+$/.test(d.email))e.email='Confira o e-mail.'}
  if(w.step===4){const t=T(d.turma);if(t.mat>=t.cap)e.turma='Escolha uma turma com vaga.'}
  w.err=e;return !Object.keys(e).length;
}
function concluirWizard(){
  const d=state.wizard.d,c=calc(),t=T(d.turma);
  const etapa=Object.values(d.docs).filter(Boolean).length<5?0:c.pct>15?1:2;

  state.wizard=null;toast(`Matrícula de ${d.nome.trim()} criada em "${ETAPAS[etapa]}".`);render();
}
function avancarMatricula(id){

  if(m.etapa<3){m.etapa++;m.obs=['','Desconto aprovado pela direção','Contrato enviado por e-mail e app','Aguardando PIX ou boleto da 1ª parcela'][m.etapa]||m.obs;toast(`${m.nome} passou para "${ETAPAS[m.etapa]}".`)}
  else{

/* ---------- pedagógico: dados ---------- */
const DISC={infantil:[['Rotina do dia',25]],
 fund1:[['Português',6],['Matemática',6],['Ciências',3],['História e Geografia',4],['Inglês',2],['Arte',2],['Educação Física',2]],
 fund2:[['Português',5],['Matemática',5],['Ciências',4],['História',3],['Geografia',3],['Inglês',3],['Arte',2]],
 medio:[['Português',4],['Matemática',5],['Física',3],['Química',3],['Biologia',3],['História',2],['Geografia',2],['Inglês',3]]};
const POLI={'1a':'Sandra Viana','3b':'Rosângela Pires','5a':'Elisa Barreto'};
const PROF={'Português':'Carla Menezes','Matemática':'Ricardo Alves','Ciências':'Fabiana Reis','Biologia':'Fabiana Reis','História':'Paulo Sérgio Lima','Geografia':'Ivone Castro','Inglês':'Jennifer Moura','Arte':'Bruno Tavares','Educação Física':'Marcelo Dias','Física':'Tiago Nunes','Química':'Tiago Nunes'};
const DIAS=['Segunda','Terça','Quarta','Quinta','Sexta'];
const HORAS=['07:15','08:05','08:55','10:05','10:55'];
const HOJE=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:2})();
const discs=tid=>DISC[T(tid).nivel].map(d=>d[0]);
function prof(tid,d){const n=T(tid).nivel;if(n==='infantil')return 'Mônica Sales';if(n==='fund1'&&['Português','Matemática','Ciências','História e Geografia'].includes(d))return POLI[tid];return PROF[d]}
function hh(...a){let x=2166136261;for(const c of a.join('|')){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return (x>>>0)/4294967296}
const r1=v=>Math.round(v*10)/10;
const fmt=v=>v===null||v===undefined||v===''?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=v=>Math.round(v*1000)/10+'%';
const BAIXO={'Pedro Henrique Araújo':4.3,'Davi Lucas Ferreira':5.1};
const NOTAS={};
function notas(s,d,b){const k=s.id+'|'+d+'|'+b;if(NOTAS[k])return NOTAS[k];
  const base=(BAIXO[s.nome]??(5.7+hh(s.id,'b')*3.3))+(hh(s.id,d)-.5)*1.4;
  const v=x=>Math.max(0,Math.min(10,r1(base+(hh(s.id,d,b,x)-.5)*2.4)));
  const n={av1:v(1),av2:b<4?v(2):null,tr:Math.min(10,r1(v(3)+.6)),rec:null};
  if(b<4){const m=media(n);if(m!==null&&m<6)n.rec=Math.min(10,r1(v(4)+1.6))}
  return NOTAS[k]=n}
const num=x=>x===null||x===''||x===undefined||isNaN(+x)?null:+x;
function media(n){const a0=num(n.av1),b0=num(n.av2),t=num(n.tr),r=num(n.rec);if(a0===null||b0===null||t===null)return null;let a=a0,b=b0;
  if(r!==null){if(a<=b){if(r>a)a=r}else if(r>b)b=r}return r1((a*4+b*4+t*2)/10)}
const peso=(tid,d)=>(DISC[T(tid).nivel].find(x=>x[0]===d)||[0,0])[1];
const P={tab:'diario',turma:'9a',slot:null,ndisc:null,bim:4,chamada:{},aulas:[],ocorr:[],closed:{},avisar:true,aluno:3,pareceres:{},corr:[]};
state.ped=P;
const registradas=(tid,d)=>P.aulas.filter(a=>a.turma===tid&&a.disc===d);
function aulasDadas(tid,d,b){return b<4?peso(tid,d)*9:peso(tid,d)*2+registradas(tid,d).length}
function faltas(s,d,b){let f=Math.floor(hh(s.id,d,b,'f')*3);if(s.nome==='Pedro Henrique Araújo')f+=b<4?9:2;if(b===4)f+=registradas(s.turma,d).filter(a=>a.faltas.includes(s.id)).length;return f}
function freq(s,d){let A=0,F=0;for(let b=1;b<=4;b++){A+=aulasDadas(s.turma,d,b);F+=faltas(s,d,b)}return A?1-F/A:1}
function freqGeral(s){let A=0,F=0;discs(s.turma).forEach(d=>{for(let b=1;b<=4;b++){A+=aulasDadas(s.turma,d,b);F+=faltas(s,d,b)}});return A?1-F/A:1}
const turmaAlunos=tid=>students.filter(s=>s.turma===tid&&s.status==='ativo');

// quadro de horários: distribuição sem choque de professor + um conflito proposital para a coordenação ver
const H={};
(function(){const busy={};['1a','3b','5a','7a','9a','em2'].forEach(tid=>{
  const pool=[];DISC[T(tid).nivel].forEach(([d,w])=>{for(let i=0;i<w;i++)pool.push(d)});pool.sort((x,y)=>hh(tid,x)-hh(tid,y));
  const g=[...Array(5)].map(()=>Array(5).fill(null));
  for(let sl=0;sl<5;sl++)for(let d=0;d<5;d++){
    const free=x=>!busy[prof(tid,x)+'|'+d+'|'+sl];const few=x=>g[d].filter(y=>y===x).length<2;
    let i=pool.findIndex(x=>free(x)&&few(x));if(i<0)i=pool.findIndex(free);if(i<0)i=0;
    const x=pool.splice(i,1)[0];g[d][sl]=x;busy[prof(tid,x)+'|'+d+'|'+sl]=1}
  H[tid]=g});
  ['7a','9a'].forEach(tid=>{const g=H[tid];if(g[2][2]==='Inglês')return;for(let d=0;d<5;d++)for(let sl=0;sl<5;sl++)if(g[d][sl]==='Inglês'){const tmp=g[2][2];g[2][2]='Inglês';g[d][sl]=tmp;return}});
})();
function conflitos(){const m={};Object.entries(H).forEach(([tid,g])=>g.forEach((row,d)=>row.forEach((x,sl)=>{const k=prof(tid,x)+'|'+d+'|'+sl;(m[k]=m[k]||[]).push(tid)})));
  return Object.entries(m).filter(([,v])=>v.length>1).map(([k,v])=>{const[p,d,sl]=k.split('|');return {p,d:+d,sl:+sl,turmas:v}})}
function slotsHoje(tid){return T(tid).nivel==='infantil'?[{d:'Rotina do dia',sl:0,hora:'07:15'}]:H[tid][HOJE].map((d,sl)=>({d,sl,hora:HORAS[sl]}))}
function aulasSemChamada(){let n=0;TURMAS.forEach(t=>slotsHoje(t.id).forEach(x=>{if(!P.aulas.some(a=>a.key===t.id+'|'+x.sl))n++}));return n}
function av2Pendentes(){let n=0;students.filter(s=>s.status==='ativo'&&T(s.turma).nivel!=='infantil').forEach(s=>discs(s.turma).forEach(d=>{if(num(notas(s,d,4).av2)===null)n++}));return n}
function parecerPadrao(s,b){const n=s.nome.split(' ')[0];return [
  `${n} participou com interesse das rodas de conversa e ampliou o vocabulário ao contar histórias para os colegas. Reconhece as cores e começa a nomear formas.`,
  `${n} mostrou mais autonomia na alimentação e na higiene. Nas brincadeiras de faz de conta, divide os brinquedos e espera a vez com ajuda da professora.`,
  `${n} explorou tintas, massinha e materiais da natureza com curiosidade. Conta até dez e relaciona quantidades pequenas aos números.`][b-1]||''}

function finDrawer(s){if(!podeVer('financeiro'))return '';const ps=F.parcelas.filter(p=>p.sid===s.id);if(!ps.length)return '';const atr=ps.filter(atrasada);const tot=atr.reduce((a,p)=>a+encargos(p).total,0);
  return `<div class="sect"><h3>Financeiro <span class="pill p-mute" style="margin-left:6px">visível para financeiro e direção</span></h3><p style="margin:0">${atr.length?`<span class="pill p-bad">${atr.length} parcela${atr.length===1?'':'s'} em atraso</span> ${brl(tot)} com encargos.`:'<span class="pill p-good">Em dia</span>'}</p>
   <p class="muted" style="margin:0;font-size:.84rem">A situação financeira não bloqueia catraca, boletim nem documentos de transferência.</p><div><button class="btn small" type="button" data-ffind="${esc(s.nome)}">Ver parcelas</button></div></div>`}

/* ---------- financeiro: telas ---------- */
const FTABS=[['mensal','Mensalidades'],['cobranca','Cobrança'],['caixa','Caixa'],['nf','Notas fiscais']];
function vFin(){
  const tit={mensal:'Mensalidades',cobranca:'Régua de cobrança',caixa:'Caixa do dia',nf:'Notas fiscais'}[F.tab];
  const sub={mensal:'Parcelas geradas pelo contrato de matrícula, com baixa automática de PIX, boleto e cartão.',cobranca:'Avisos automáticos antes e depois do vencimento, e acordos para atrasos longos.',
    caixa:'Recebimentos de hoje, fechamento do caixa da secretaria e contas a pagar.',nf:'NFS-e emitida automaticamente a cada pagamento confirmado.'}[F.tab];
  const body=F.tab==='mensal'?fMensal():F.tab==='cobranca'?fCobranca():F.tab==='caixa'?fCaixa():fNF();
  return `<header class="top"><div><span class="eyebrow">Financeiro · ${dmy(HOJE_D)}/2026</span><h1>${tit}</h1><p>${sub}</p></div><span class="tag-ex">Dados de exemplo</span></header>

}
function fMensal(){
  const out=F.parcelas.filter(p=>p.m===10&&!p.acordo);
  const rec=out.filter(p=>p.status==='paga').reduce((a,p)=>a+p.pagoValor,0),aRec=out.filter(p=>p.status==='aberta').reduce((a,p)=>a+p.valor,0);
  const atr=finAtrasadas(),vAtr=atr.reduce((a,p)=>a+p.valor,0),fam=new Set(atr.map(p=>p.sid)).size;
  const venc=F.parcelas.filter(p=>p.venc<=HOJE_D&&p.status!=='cancelada'),fat=venc.reduce((a,p)=>a+p.valor,0);
  const faixas=[['1 a 15 dias',1,15],['16 a 30 dias',16,30],['31 a 60 dias',31,60],['Mais de 60 dias',61,9999]].map(([l,a,b])=>{const ps=atr.filter(p=>dias(p)>=a&&dias(p)<=b);return {l,n:ps.length,v:ps.reduce((x,p)=>x+p.valor,0)}});
  const maxF=Math.max(...faixas.map(f=>f.v),1);

  list.sort((a,b)=>F.filtro==='atraso'?dias(b)-dias(a):F.filtro==='pagas'?b.pagoEm-a.pagoEm:a.venc-b.venc||S(a.sid).nome.localeCompare(S(b.sid).nome));
  const shown=list.slice(0,60);
  return `<section class="kpis" aria-label="Resumo do mês">
    <div class="kpi"><span class="eyebrow">Recebido em outubro</span><span class="v" style="font-size:1.6rem">${brl(rec)}</span><span class="d">${out.filter(p=>p.status==='paga').length} de ${out.length} parcelas</span></div>
    <div class="kpi"><span class="eyebrow">A receber em outubro</span><span class="v" style="font-size:1.6rem">${brl(aRec)}</span><span class="d">venceram em 10/10</span></div>
    <div class="kpi hl"><span class="eyebrow">Em atraso</span><span class="v" style="font-size:1.6rem">${brl(vAtr)}</span><span class="d">${atr.length} parcelas · ${fam} família${fam===1?'':'s'}</span></div>
    <div class="kpi"><span class="eyebrow">Inadimplência no ano</span><span class="v" style="font-size:1.6rem">${pct(fat?vAtr/fat:0)}</span><span class="d">do valor já vencido em 2026</span></div>
  </section>
  <div class="grid2">
   <section class="panel" style="min-width:0">
    <div class="filters" style="margin-bottom:12px"><input class="input search" id="fq" type="search" placeholder="Buscar aluno ou responsável" value="${esc(F.q)}" aria-label="Buscar parcelas">
     <div class="chips" role="group" aria-label="Filtrar parcelas">${[['atraso','Em atraso'],['mes','Outubro'],['avencer','A vencer'],['pagas','Pagas'],['todas','Todas']].map(([k,l])=>`<button type="button" class="chip" data-ff="${k}" aria-pressed="${F.filtro===k}">${l}</button>`).join('')}</div></div>
    ${shown.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Aluno · responsável</th><th>Parcela</th><th class="n">Valor</th><th>Situação</th><th></th></tr></thead><tbody>
     ${shown.map(p=>{const s=S(p.sid),e=encargos(p);return `<tr><td><b style="font-weight:600">${esc(s.nome)}</b><br><span class="muted" style="font-size:.8rem">${esc(s.resp)}</span></td><td>${p.label}<br><span class="muted mono" style="font-size:.8rem">vence ${dmy(p.venc)}</span></td>
      <td class="n">${brl(p.status==='paga'?p.pagoValor:e.total)}${e.total!==p.valor?`<br><span class="muted" style="font-size:.76rem">original ${brl(p.valor)}</span>`:''}</td><td>${sitParc(p)}${p.forma&&p.status==='paga'?`<br><span class="muted" style="font-size:.78rem">${p.forma}</span>`:''}</td>
      <td style="white-space:nowrap">${p.status==='aberta'?`<button type="button" class="btn small primary" data-freceber="${p.id}">Receber</button> <button type="button" class="btn small" data-flink="${p.id}">Enviar PIX</button>`:p.status==='paga'?`<button type="button" class="btn small" data-frecibo="${p.id}">Recibo</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
     ${list.length>shown.length?`<p class="muted" style="font-size:.84rem;margin:10px 0 0">Mostrando ${shown.length} de ${list.length}. Use a busca para encontrar um aluno.</p>`:''}`:'<p class="empty">Nenhuma parcela neste filtro.</p>'}
   </section>
   <div class="stack">
    <section class="panel"><div class="panel-head"><h2>Atraso por faixa</h2><span class="muted" style="font-size:.82rem">valor original</span></div>

     <p class="muted" style="font-size:.82rem;margin:12px 0 0">Multa de 2% e juros de 1% ao mês, proporcionais aos dias de atraso.</p></section>
    <section class="panel"><h2 style="margin-bottom:8px">Regra da escola</h2><p style="margin:0;font-size:.92rem">Atraso de pagamento não bloqueia a catraca, o boletim nem a transferência. Ele só impede a rematrícula para o ano seguinte, como prevê a lei.</p></section>
    <p class="muted" style="font-size:.8rem;margin:0">Valores referentes aos ${students.length} alunos da lista de exemplo.</p>
   </div>
  </div>`;
}
function etapaCount(i){const st=F.regua[i],nx=F.regua[i+1];
  if(st.d<0)return F.parcelas.filter(p=>p.status==='aberta'&&-dias(p)>=1&&-dias(p)<=-st.d).length;
  if(st.d===0)return F.parcelas.filter(p=>p.status==='aberta'&&dias(p)===0).length;
  return F.parcelas.filter(p=>atrasada(p)&&dias(p)>=st.d&&(!nx||dias(p)<nx.d)).length}
const dLabel=d=>d<0?'D−'+(-d):d===0?'D0':'D+'+d;
function fCobranca(){
  const fam={};finAtrasadas().forEach(p=>{(fam[p.sid]=fam[p.sid]||[]).push(p)});
  const longos=Object.entries(fam).filter(([,ps])=>Math.max(...ps.map(dias))>30);
  return `<div class="grid2">
   <section class="panel stack" style="gap:12px"><div class="panel-head" style="margin:0"><h2>Etapas da régua</h2><button type="button" class="btn primary small" data-fact="executar">Enviar avisos de hoje</button></div>
    ${F.regua.map((r,i)=>{const n=etapaCount(i);return `<div class="att" style="grid-template-columns:56px minmax(0,1fr) auto"><span class="mono" style="font-weight:600;color:${r.on?'var(--accent)':'var(--muted)'}">${dLabel(r.d)}</span>
     <div class="who" style="min-width:0"><b>${esc(r.nome)}</b><span>${r.canais.join(' · ')} · ${n} parcela${n===1?'':'s'} nesta etapa hoje</span></div>
     <label class="switch"><input type="checkbox" data-rstep="${i}" ${r.on?'checked':''} aria-label="Ativar etapa ${dLabel(r.d)}"></label></div>`}).join('')}
    <p class="muted" style="margin:0;font-size:.84rem">Os avisos saem entre 8h e 20h, de segunda a sábado. Quem pagou sai da régua na hora, pela baixa automática.</p>
   </section>
   <section class="panel stack" style="gap:12px"><h2>Atrasos acima de 30 dias</h2>
    ${longos.length?longos.map(([sid,ps])=>{const s=S(+sid),tot=ps.reduce((a,p)=>a+encargos(p).total,0);return `<div class="card"><b>${esc(s.nome)}</b><span class="meta">Responsável: ${esc(s.resp)} · ${esc(s.tel)}</span>
     <span class="meta">${ps.map(p=>p.label).join(', ')} · maior atraso ${Math.max(...ps.map(dias))} dias</span><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b class="num">${brl(tot)}</b><button type="button" class="btn small primary" data-facordo="${sid}">Propor acordo</button></div></div>`}).join(''):'<p class="muted" style="margin:0">Nenhuma família com atraso acima de 30 dias.</p>'}
    ${F.acordos.length?`<h3 style="margin-top:6px">Acordos feitos</h3>${F.acordos.map(a=>`<div class="card"><b>${esc(S(a.sid).nome)}</b><span class="meta">Entrada de ${brl(a.entrada)} + ${a.n}× ${brl(a.parcela)} a partir de 10/11</span><span class="pill p-info" style="align-self:flex-start">Termo enviado para assinatura</span></div>`).join('')}`:''}
   </section></div>`;
}
function fCaixa(){
  const porForma={};F.movs.forEach(m=>porForma[m.forma]=(porForma[m.forma]||0)+m.valor);const tot=F.movs.reduce((a,m)=>a+m.valor,0);
  const entPrev=F.parcelas.filter(p=>p.status==='aberta'&&p.venc>HOJE_D&&p.venc<=new Date(2026,10,13)).reduce((a,p)=>a+p.valor,0);
  const saiPrev=F.contas.filter(c=>!c.paga).reduce((a,c)=>a+c.valor,0);
  return `<div class="grid2">
   <section class="panel"><div class="panel-head"><h2>Movimento de hoje</h2>${F.caixa?`<span class="pill p-mute">Caixa fechado às ${F.caixa.hora}</span>`:`<button type="button" class="btn small primary" data-fact="fechar">Fechar caixa</button>`}</div>
    ${F.movs.length?`<div class="scroll"><table class="tbl" style="min-width:520px"><thead><tr><th>Hora</th><th>Descrição</th><th>Forma</th><th class="n">Valor</th></tr></thead><tbody>
     ${[...F.movs].sort((a,b)=>a.hora.localeCompare(b.hora)).map(m=>`<tr><td class="mono">${m.hora}</td><td>${esc(m.desc)}<br><span class="muted" style="font-size:.78rem">${m.origem}</span></td><td>${m.forma}</td><td class="n">${brl(m.valor)}</td></tr>`).join('')}</tbody>
     <tfoot><tr><td></td><td>Total do dia</td><td></td><td class="n">${brl(tot)}</td></tr></tfoot></table></div>`:'<p class="empty">Nenhum recebimento hoje.</p>'}
    <div class="stats" style="margin-top:12px">${Object.entries(porForma).map(([f,v])=>`<div class="stat"><b style="font-size:1.1rem">${brl(v)}</b><span>${f}</span></div>`).join('')}</div>
   </section>
   <div class="stack">
    <section class="panel"><div class="panel-head"><h2>Contas a pagar</h2><span class="muted" style="font-size:.82rem">outubro</span></div>
     <ul class="todo">${F.contas.map(c=>`<li><span style="min-width:0"><b style="font-family:var(--f-body);font-size:.9rem;display:block">${esc(c.nome)}</b><span class="muted mono" style="font-size:.8rem">vence ${c.dia}/10 · ${brl(c.valor)}</span></span>${c.paga?'<span class="pill p-good">Paga</span>':`<button type="button" class="btn small" data-fpagar="${c.id}">Marcar como paga</button>`}</li>`).join('')}</ul></section>
    <section class="panel"><h2 style="margin-bottom:10px">Próximos 30 dias</h2><div class="summary">
     <div class="line"><span>Saldo em conta hoje</span><span class="num">${brl(F.saldo)}</span></div>
     <div class="line"><span>Entradas previstas (mensalidades de novembro)</span><span class="num">+ ${brl(entPrev)}</span></div>
     <div class="line"><span>Saídas previstas (contas a pagar)</span><span class="num">− ${brl(saiPrev)}</span></div>
     <div class="line total"><span>Saldo projetado em 13/11</span><span class="num">${brl(F.saldo+entPrev-saiPrev)}</span></div></div>
     <p class="muted" style="font-size:.8rem;margin:10px 0 0">Folha de pagamento fica fora deste protótipo.</p></section>
   </div></div>`;
}
function fNF(){

  return `<section class="panel stack" style="gap:14px">

    <span class="muted" style="font-size:.86rem">${F.nfs.filter(n=>n.status==='emitida').length} emitidas · ${F.nfs.filter(n=>n.status==='erro').length} com erro</span></div>

   <p class="muted" style="margin:0;font-size:.82rem">Emitidas pelo provedor de notas fiscais integrado à prefeitura. Mostrando as notas de outubro.</p></section>`;

function receberModal(p){const s=S(p.sid),e=encargos(p);
  modal(`<h2>Receber ${p.label}</h2><p class="muted" style="margin:0">${esc(s.nome)} · responsável ${esc(s.resp)}</p>
   <div class="summary"><div class="line"><span>Valor da parcela</span><span class="num">${brl(p.valor)}</span></div>${e.multa?`<div class="line"><span>Multa (2%)</span><span class="num">${brl(e.multa)}</span></div><div class="line"><span>Juros (${dias(p)} dias)</span><span class="num">${brl(e.juros)}</span></div>`:''}<div class="line total"><span>Total</span><span class="num" id="rc_tot">${brl(e.total)}</span></div></div>
   <div class="field"><label for="rc_forma">Forma de pagamento</label><select class="select" id="rc_forma"><option>Dinheiro</option><option>PIX</option><option>Cartão de débito</option><option>Cartão de crédito</option></select></div>
   ${e.multa?`<label class="check"><input type="checkbox" id="rc_isento"> Dispensar multa e juros</label><div class="field" id="rc_mot_f" hidden><label for="rc_mot">Motivo da dispensa</label><textarea class="input" id="rc_mot" rows="2" placeholder="Fica registrado com o seu usuário"></textarea><span class="err" id="merr" hidden>Informe o motivo (mínimo de 10 caracteres).</span></div>`:''}
   <div class="actions"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" data-fact="confreceber" data-pid="${p.id}">Confirmar recebimento</button></div>`)}
function acordoModal(sid){const s=S(sid),ps=finAtrasadas().filter(p=>p.sid===sid),tot=r2(ps.reduce((a,p)=>a+encargos(p).total,0));
  modal(`<h2>Acordo · ${esc(s.nome)}</h2><p class="muted" style="margin:0">${ps.map(p=>p.label).join(', ')} · total com encargos <b class="num">${brl(tot)}</b></p>
   <div class="form"><div class="field"><label for="ac_ent">Entrada (R$)</label><input class="input" id="ac_ent" inputmode="decimal" value="${String(r2(tot*.2)).replace('.',',')}"></div>
   <div class="field"><label for="ac_n">Parcelas</label><select class="select" id="ac_n">${[2,3,4,5,6].map(n=>`<option ${n===3?'selected':''}>${n}</option>`).join('')}</select></div></div>
   <div class="summary" id="ac_sum" data-tot="${tot}"></div><span class="err" id="merr" hidden>A entrada precisa ser maior que zero e menor que o total.</span>
   <div class="actions"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" data-fact="confacordo" data-sid="${sid}">Gerar acordo</button></div>`);acordoSum()}
function acordoSum(){const el=document.getElementById('ac_sum');if(!el)return;const tot=+el.dataset.tot,ent=+(document.getElementById('ac_ent').value.replace(',','.'))||0,n=+document.getElementById('ac_n').value;
  el.innerHTML=`<div class="line"><span>Entrada hoje</span><span class="num">${brl(ent)}</span></div><div class="line total"><span>${n}× a partir de 10/11</span><span class="num">${brl(Math.max(0,(tot-ent)/n))}</span></div>`}
function nowHM(){const d=new Date();return hhmm(d.getHours()*60+d.getMinutes())}
document.addEventListener('click',e=>{
  const t=e.target;
  const ft=t.closest('[data-ftab]');if(ft){F.tab=ft.dataset.ftab;rerenderPed();return}
  const ff=t.closest('[data-ff]');if(ff){F.filtro=ff.dataset.ff;rerenderPed();return}
  const fd=t.closest('[data-ffind]');if(fd){F.q=fd.dataset.ffind;F.filtro='todas';F.tab='mensal';closeLayer();go('financeiro');return}
  const rc=t.closest('[data-freceber]');if(rc){receberModal(P_(+rc.dataset.freceber));return}
  const lk=t.closest('[data-flink]');if(lk){const p=P_(+lk.dataset.flink),s=S(p.sid);toast(`PIX de ${brl(encargos(p).total)} enviado a ${s.resp} no app e no WhatsApp.`);return}
  const rb=t.closest('[data-frecibo]');if(rb){toast('Recibo reenviado ao responsável no app.');return}
  const ac=t.closest('[data-facordo]');if(ac){acordoModal(+ac.dataset.facordo);return}
  const pg=t.closest('[data-fpagar]');if(pg){const c=F.contas.find(x=>x.id===+pg.dataset.fpagar);c.paga=true;F.saldo=r2(F.saldo-c.valor);toast(`${c.nome.split(' · ')[0]} paga. Saldo atualizado.`);rerenderPed();return}
  const nf=t.closest('[data-fnf]');if(nf){const n=F.nfs.find(x=>x.num===+nf.dataset.fnf),s=S(P_(n.pid).sid);modal(`<h2>Corrigir e reenviar</h2><p class="muted" style="margin:0">A prefeitura recusou a nota de ${esc(s.resp)}: ${esc(n.erro)}.</p>

/* ---------- fase 4: indicadores ---------- */
function inadimplencia(){const atr=finAtrasadas().reduce((a,p)=>a+p.valor,0),fat=F.parcelas.filter(p=>p.venc<=HOJE_D&&p.status!=='cancelada').reduce((a,p)=>a+p.valor,0);return fat?atr/fat:0}
function riscos(){return students.filter(s=>s.status==='ativo'&&T(s.turma).nivel!=='infantil').map(s=>{const sig=[];let sc=0;
  const fr=freqGeral(s);if(fr<.85){sig.push(['Frequência '+pct(fr),'p-warn']);sc+=fr<.8?3:2}
  const low=discs(s.turma).filter(d=>{const m=media(notas(s,d,3));return m!==null&&m<6}).length;if(low){sig.push([`${low} nota${low===1?'':'s'} abaixo de 6`,'p-warn']);sc+=Math.min(3,low)}
  const at=F.parcelas.filter(p=>p.sid===s.id&&atrasada(p));if(at.length){const mx=Math.max(...at.map(dias));sig.push([`${at.length} parcela${at.length===1?'':'s'} em atraso`,'p-bad']);sc+=mx>30?3:1}
  const naoLe=hh(s.id,'com')>.78;if(naoLe){sig.push(['Não lê os comunicados','p-mute']);sc+=1}
  const oc=P.ocorr.filter(o=>o.sid===s.id).length;if(oc){sig.push([`${oc} ocorrência${oc===1?'':'s'}`,'p-warn']);sc+=1}
  return {s,sig,sc}}).filter(r=>r.sc>=3).sort((a,b)=>b.sc-a.sc)}
function chartRecebido(){
  const vals=MES.slice(0,10).map((m,i)=>F.parcelas.filter(p=>p.m===i+1&&p.status==='paga').reduce((a,p)=>a+p.pagoValor,0));
  const max=Math.max(...vals),step=10000,top=Math.ceil(max/step)*step,W=640,H=230,L=56,R=12,TP=16,B=28,iw=W-L-R,ih=H-TP-B,bw=iw/10;
  const y=v=>TP+ih-(v/top)*ih,ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  const k=v=>v===0?'0':(v/1000)+' mil';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mensalidades recebidas por mês, de janeiro a outubro de 2026">
   ${ticks.map(v=>`<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${k(v)}</text>`).join('')}
   ${vals.map((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,h=Math.max(0,y(0)-y(v));return `<g class="b"><title>${MES[i]}/2026: ${brl(v)}</title><rect x="${L+i*bw}" y="${TP}" width="${bw}" height="${ih}" fill="transparent"/><path class="bar-r" d="M${x} ${y(0)}V${y(v)+4}Q${x} ${y(v)} ${x+4} ${y(v)}H${x+w-4}Q${x+w} ${y(v)} ${x+w} ${y(v)+4}V${y(0)}Z"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${MES[i]}</text>${i===9?`<text x="${x+w/2}" y="${y(v)-6}" text-anchor="middle" style="fill:var(--ink);font-weight:500">${k(Math.round(v/100)*100)}</text>`:''}</g>`}).join('')}
  </svg>`;
}
function vInd(){
  const occ=TURMAS.reduce((a,t)=>a+t.mat,0)/TURMAS.reduce((a,t)=>a+t.cap,0);
  const roster=students.filter(s=>s.status==='ativo'&&T(s.turma).nivel!=='infantil');const fm=roster.reduce((a,s)=>a+freqGeral(s),0)/roster.length;
  const m27=matric2027(),rs=riscos(),mat=C.leads.filter(l=>l.etapa===4).length,per=C.leads.filter(l=>l.etapa===5).length;
  const linhas=TURMAS.map(t=>{const al=students.filter(s=>s.turma===t.id&&s.status==='ativo');const inf=t.nivel==='infantil';
    const ms=inf?[]:al.flatMap(s=>discs(t.id).map(d=>media(notas(s,d,3)))).filter(x=>x!==null);const med=ms.length?ms.reduce((a,x)=>a+x,0)/ms.length:null;
    const fr=inf||!al.length?null:al.reduce((a,s)=>a+freqGeral(s),0)/al.length;const at=new Set(finAtrasadas().filter(p=>S(p.sid).turma===t.id).map(p=>p.sid)).size;
    return `<tr><td>${esc(t.nome)}</td><td class="n">${t.mat}/${t.cap}</td><td class="n ${med!==null&&med<6.5?'low':''}">${med===null?'—':fmt(r1(med))}</td><td class="n">${fr===null?'—':pct(fr)}</td><td class="n">${at}</td></tr>`}).join('');
  return `<header class="top"><div><span class="eyebrow">Direção</span><h1>Indicadores da escola</h1><p>Um retrato do ano letivo que junta secretaria, ensino, financeiro e captação.</p></div><span class="tag-ex">Dados de exemplo</span></header>
  <section class="kpis"><div class="kpi"><span class="eyebrow">Alunos ativos</span><span class="v">${ativos()}</span><span class="d">${pct(occ)} das vagas ocupadas</span></div>
   <div class="kpi"><span class="eyebrow">Frequência média</span><span class="v">${pct(fm)}</span><span class="d">fundamental e médio, no ano</span></div>
   <div class="kpi"><span class="eyebrow">Inadimplência</span><span class="v">${pct(inadimplencia())}</span><span class="d">do valor vencido em 2026</span></div>
   <div class="kpi hl"><span class="eyebrow">Matrículas novas 2027</span><span class="v">${m27} <small>de ${C.meta}</small></span><span class="d">conversão do funil ${mat+per?Math.round(mat/(mat+per)*100):0}%</span></div></section>
  <div class="grid2">
   <section class="panel"><div class="panel-head"><h2>Alunos com risco de evasão</h2><span class="muted" style="font-size:.82rem">${rs.length} aluno${rs.length===1?'':'s'}</span></div>
    ${rs.length?rs.map(r=>{const nv=r.sc>=6?['Alto','p-bad']:r.sc>=4?['Médio','p-warn']:['Atenção','p-mute'];const ag=Fm.agend[r.s.id];return `<div class="risk">${av(r.s.nome)}<div style="min-width:0"><b>${esc(r.s.nome)}</b> <span class="pill ${nv[1]}">Risco ${nv[0].toLowerCase()}</span><br><span class="muted" style="font-size:.8rem">${esc(T(r.s.turma).nome)} · resp. ${esc(r.s.resp)}</span>
     <div class="sigs">${r.sig.map(([l,c])=>`<span class="pill ${c}">${esc(l)}</span>`).join('')}</div></div><div class="act">${ag?'<span class="pill p-good">Conversa agendada</span>':`<button type="button" class="btn small primary" data-iconv="${r.s.id}">Agendar conversa</button>`}</div></div>`}).join(''):'<p class="empty">Nenhum aluno com sinais de risco.</p>'}
    <p class="muted" style="font-size:.82rem;margin:10px 0 0">Sinais combinados: frequência, notas do 3º bimestre, parcelas em atraso, leitura de comunicados e ocorrências.</p></section>
   <div class="stack">
    <section class="panel chart"><div class="panel-head"><h2>Mensalidades recebidas</h2><span class="muted" style="font-size:.82rem">por mês de referência, 2026</span></div>${chartRecebido()}
     <p class="muted" style="font-size:.82rem;margin:8px 0 0">Outubro ainda recebe pagamentos em atraso. Passe o mouse sobre as barras para ver os valores.</p></section>
    <section class="panel"><h2 style="margin-bottom:10px">Turmas</h2><div class="scroll"><table class="tbl" style="min-width:440px"><thead><tr><th>Turma</th><th class="n">Alunos</th><th class="n">Média 3º bim</th><th class="n">Frequência</th><th class="n">Em atraso</th></tr></thead><tbody>${linhas}</tbody></table></div>
     <p class="muted" style="font-size:.8rem;margin:8px 0 0">Médias e frequência calculadas sobre os alunos da lista de exemplo.</p></section>
   </div></div>`;
}

function codigoDoc(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='PT';for(let i=0;i<6;i++){s+=c[Math.floor(Math.random()*c.length)];if(i===1)s+='-'}return s.slice(0,4)+'-'+s.slice(5,9)}
function qrSvg(code){const n=21,c=4;let r='';const fin=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#1d1a14"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fffdf8"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#1d1a14"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);if(!inF&&hh(code,x,y)>.5)r+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#1d1a14"/>`}
  return `<svg class="qr" viewBox="0 0 ${n*c} ${n*c}" role="img" aria-label="QR code de validação ${code}"><rect width="${n*c}" height="${n*c}" fill="#fffdf8"/>${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`}
function textoDoc(tipo,s){const t=T(s.turma),nasc=s.nasc.split('-').reverse().join('/');

  if(tipo==='frequencia')return `Declaramos que <b>${esc(s.nome)}</b>, matrícula ${s.mat}, aluno(a) do ${esc(t.nome)}, apresenta frequência de <b>${t.nivel==='infantil'?'100%':pct(freqGeral(s))}</b> no ano letivo de 2026 até esta data.`;
  if(tipo==='transferencia')return `Declaramos que <b>${esc(s.nome)}</b>, matrícula ${s.mat}, cursou nesta instituição o ${esc(t.nome)} no ano letivo de 2026, estando apto(a) a prosseguir os estudos. O histórico escolar será entregue em até 30 dias.`;

    modal(`<h2>${esc(n)} cadastrada</h2><div class="callout good">Copie o token agora. Ele não aparece de novo.</div><code class="mono" style="word-break:break-all;background:var(--sunk);padding:12px;border-radius:10px;display:block">${tok}</code><div class="actions"><button class="btn primary" type="button" data-close>Pronto</button></div>`);rerenderPed();return}
  if(t.closest('[data-cfnovo]')){modal(`<h2>Novo acesso</h2><div class="form"><div class="field full"><label for="nu_nome">Nome</label><input class="input" id="nu_nome"></div><div class="field full"><label for="nu_email">E-mail</label><input class="input" id="nu_email" type="email"></div>
    <div class="field full"><label for="nu_perfil">Perfil</label><select class="select" id="nu_perfil">${Object.keys(PERFIS).filter(k=>k!=='ADMIN').map(k=>`<option value="${k}">${PERFIS[k]}</option>`).join('')}</select></div></div><span class="err" id="merr" hidden style="color:var(--bad);font-size:.84rem">Preencha nome e um e-mail válido.</span>
    <div class="actions"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" data-cfnovook>Criar e enviar convite</button></div>`);return}
  if(t.closest('[data-cfnovook]')){const n=document.getElementById('nu_nome').value.trim(),em=document.getElementById('nu_email').value.trim().toLowerCase();if(n.length<3||!/^\S+@\S+\.\S+$/.test(em)){document.getElementById('merr').hidden=false;return}
    EQUIPE.push({nome:n,email:em,perfil:document.getElementById('nu_perfil').value,ativo:true});CF.log.unshift(['14/10 '+nowHM(),state.user.nome,`Acesso criado para ${n}`]);closeLayer();toast(`Convite enviado para ${em}.`);rerenderPed();return}
});

/* ---------- render ---------- */
function render(){
  renderNav();
  const m=document.getElementById('main');
  m.innerHTML=state.view==='painel'?vPainel():state.view==='alunos'?vAlunos():state.view==='matricula'?vMatricula():state.view==='pedagogico'?vPed():state.view==='financeiro'?vFin():state.view==='captacao'?vCapt():state.view==='familias'?vFam():state.view==='indicadores'?vInd():state.view==='documentos'?vDocs():state.view==='config'?vConfig():vPortaria();
}

/* ---------- eventos ---------- */
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;document.getElementById('rows').innerHTML=rowsHTML()}
  if(e.target.dataset.w&&state.wizard){state.wizard.d[e.target.dataset.w]=e.target.value;if(e.target.id==='w_nome'){const h=document.querySelector('.top h1');if(h)h.textContent=e.target.value||'Novo aluno'}}
  if(e.target.id==='motivo'){const er=document.getElementById('merr');if(er)er.hidden=true}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fTurma'){state.fTurma=el.value;document.getElementById('rows').innerHTML=rowsHTML()}
  if(el.id==='sel')state.sel=el.value;
  if(el.id==='auto'){state.auto=el.checked;toast(el.checked?'Movimento automático ligado.':'Movimento automático desligado.')}
  if(el.dataset.w&&state.wizard){state.wizard.d[el.dataset.w]=el.value;if(el.dataset.w==='parc')render()}
  if(el.dataset.docK){state.wizard.d.docs[el.dataset.docK]=el.checked;render()}
  if(el.dataset.desc){state.wizard.d.desc[el.dataset.desc]=el.checked;render()}
  if(el.hasAttribute('data-tp')){state.wizard.d.turma=el.value}
});
document.addEventListener('click',e=>{
  const t=e.target;
  const fs=t.closest('[data-fs]');if(fs){state.fStatus=fs.dataset.fs;document.querySelectorAll('[data-fs]').forEach(b=>b.setAttribute('aria-pressed',b===fs));document.getElementById('rows').innerHTML=rowsHTML();return}
  const lf=t.closest('[data-lf]');if(lf){state.logFilter=lf.dataset.lf;refreshPortaria();return}
  const op=t.closest('[data-open]');if(op){state.drawer=+op.dataset.open;document.getElementById('layer').innerHTML=drawerHTML(S(state.drawer));document.querySelector('.drawer .close').focus();return}
  if(t.closest('[data-close]')){closeLayer();return}
  const dc=t.closest('[data-doc]');if(dc){toast(`${dc.dataset.doc} gerada em PDF com QR code de validação.`);return}
  const adv=t.closest('[data-adv]');if(adv){avancarMatricula(+adv.dataset.adv);return}
  const a=t.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='nova'){state.wizard=newWizard();state.view='matricula';render();return}
  if(act==='cancelwiz'){state.wizard=null;render();return}
  if(act==='voltar'){state.wizard.step--;state.wizard.err={};render();return}
  if(act==='avancar'){if(!validar()){render();const f=document.querySelector('.field .err');f&&f.closest('.field').querySelector('input,select').focus();return}
    if(state.wizard.step===4){concluirWizard();return}state.wizard.step++;render();return}
  if(act==='passar'||act==='manual'){
    if(!state.sel){toast('Escolha um aluno na lista.');document.getElementById('sel').focus();return}
    const s=S(+state.sel);
    if(act==='manual'){if(s.status!=='ativo'){toast('Matrícula inativa: liberação manual exige a secretaria.');return}manualModal(s);return}
    const r=registrar(s);
    if(r.precisa){saidaModal(s);return}
    toast(r.msg);afterEvent();return}
  if(act==='confsaida'){const s=S(+a.dataset.sid);const q=document.querySelector('input[name="quem"]:checked');if(!q){document.getElementById('merr').hidden=false;return}
    const r=registrar(s,{com:q.value});closeLayer();toast(r.msg);afterEvent();return}
  if(act==='negar'){const s=S(+a.dataset.sid);state.log.push({t:state.clock,sid:s.id,tipo:'bloqueio',tag:'',nota:'Saída negada: sem acompanhante autorizado'});closeLayer();toast('Saída negada e registrada. Coordenação avisada.');afterEvent();return}
  if(act==='confmanual'){const s=S(+a.dataset.sid);const mo=document.getElementById('motivo').value.trim();if(mo.length<10){document.getElementById('merr').hidden=false;return}
    const r=registrar(s,{manual:true,motivo:mo,com:precisaResp(s)&&s.dentro?'liberação da portaria':undefined});closeLayer();toast(r.msg||'Liberação registrada.');afterEvent();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('layer').innerHTML)closeLayer()});

/* ---------- movimento automático ---------- */
let blockedTried=false;
setInterval(()=>{
  if(!state.auto||document.hidden||document.getElementById('layer').innerHTML)return;
  const fora=students.filter(s=>s.status==='ativo'&&!s.dentro&&!state.log.some(e=>e.sid===s.id&&e.tipo==='saida'));
  let s;
  if(!blockedTried&&state.clock>7*60+12){s=students.find(x=>x.status!=='ativo');blockedTried=true}
  else if(fora.length)s=fora[Math.floor(Math.random()*fora.length)];
  else{state.auto=false;const c=document.getElementById('auto');if(c)c.checked=false;toast('Todos os alunos da lista já entraram. Movimento automático desligado.');return}
  state.clock+=Math.random()<.5?0:1;
  registrar(s);afterEvent();
},5000);

try{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))state.view=h}catch(e){}
state.user=null;showLogin();
})();
</script>

</body>
</html>
