# Banco local para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: patio
    ports:
      - "5432:5432"
    volumes:
      - patio-db:/var/lib/postgresql/data
volumes:
  patio-db:
